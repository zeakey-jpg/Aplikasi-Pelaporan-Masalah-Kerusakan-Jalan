{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h1 class="card-title">Terima Kasih!</h1>
        <p>Laporan Anda telah diterima dan akan ditindaklanjuti oleh pihak berwenang.</p>
        <p><strong>ID Laporan:</strong> {{ report.id }}</p>
        <p><strong>Status:</strong> {{ report.status }}</p>
        <a href="{{ url_for('report') }}" class="btn btn-primary">Kembali ke Form</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
